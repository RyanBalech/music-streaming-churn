[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "music-streaming-churn"
version = "0.1.0"
description = "Temporal churn labeling, event-log features and reproducible user-level evaluation"
requires-python = ">=3.11"
dependencies = ["duckdb==1.4.3", "numpy==2.3.5", "pandas==2.2.3", "pyarrow==22.0.0", "scikit-learn==1.8.0", "scipy==1.17.0", "joblib==1.5.3", "threadpoolctl==3.6.0"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.0"]
plots = ["matplotlib==3.10.8"]

[project.scripts]
churn = "churn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
